<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700;8..60,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--ink:#16131d;--mut:#6c6676;--line:#e7e1d7;--v:#5a2bd0;--v2:#efe8ff;--v3:#d9cbff;--ok:#1f9d63;--bad:#e5484d;--i0:#ef5b3a;--i1:#11a07d;--i2:#2f6fe4;--gold:#f2b705;--silver:#a9b1c2;--bronze:#d08a4e;
 --serif:'Source Serif 4',Georgia,serif;--sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0d16;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#wrap{position:fixed;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--bg);overflow:hidden}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:100%}
.pi{shape-rendering:crispEdges;display:inline-block;vertical-align:middle;flex:none}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 26px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:19px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(22,19,29,.18)}
.btn:active{transform:translateY(1px)}
.btn.v{background:var(--v)}.btn.w{background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.btn.sm{height:46px;font-size:16px;padding:0 20px}

/* top */
.top{height:96px;display:grid;grid-template-columns:600px 1fr;align-items:center;padding:0 28px;gap:26px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:-.4px}
.rd{font-family:var(--sans);font-weight:700;font-size:15px;background:#fff;border-radius:999px;padding:7px 13px;box-shadow:inset 0 0 0 1.5px var(--line);letter-spacing:0}
.ask{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 10px 10px 30px;box-shadow:0 10px 30px rgba(22,19,29,.16)}
.ask .q{font-family:var(--serif);font-weight:800;font-size:33px;letter-spacing:-.5px;white-space:nowrap;margin-right:auto}
.ask .q em{font-style:normal;color:#c9b6ff}
.lp{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 16px 6px 6px}
.lp b{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%}
.lp.r b{background:var(--v)}.lp.f b{background:#fff}
.lp span{color:#bdb4cf;font-weight:500}

/* body */
.body{position:absolute;left:0;right:0;top:96px;bottom:0;display:grid;grid-template-columns:600px 1fr;gap:26px;padding:0 28px 26px}
.prof{display:flex;flex-direction:column;gap:12px;min-height:0}
.who{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.who h2{font-family:var(--serif);font-weight:800;font-size:58px;line-height:.92;letter-spacing:-1.5px}
.who .sub{font-size:18px;color:var(--mut);margin-top:8px;font-weight:500;display:flex;align-items:center;gap:12px}
.act{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--ok);background:#e6f6ee;padding:4px 10px;border-radius:999px;white-space:nowrap}
.act i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,99,.2)}
.x2{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#fff;background:var(--v);padding:7px 12px;border-radius:999px;margin-bottom:6px}
.vit{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.vit span{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 11px;font-size:15.5px;font-weight:600;white-space:nowrap;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.sit{flex:1;min-height:0;background:var(--ink);color:#fff;border-radius:26px;padding:24px 30px 26px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sit h4{font-size:18px;font-weight:700;color:#c9b6ff;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.sit p{font-size:27px;line-height:1.38;font-weight:500;letter-spacing:-.1px}
.sit p b{font-weight:700;color:#fff;background:linear-gradient(transparent 62%,rgba(146,104,255,.55) 62%)}
.sit .qq{margin-top:auto;padding-top:14px;font-family:var(--serif);font-weight:800;font-size:30px;color:#c9b6ff}
.prs{display:grid;grid-template-columns:1fr;gap:8px;flex:none}
.pr{background:#fff;border-radius:18px;padding:10px 16px 12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.pr .l{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:2px}
.pr .a{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.25}

.right{display:flex;flex-direction:column;gap:20px;min-height:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pc{display:flex;flex-direction:column;animation:pin .7s cubic-bezier(.2,.9,.25,1.15) both}
.pc .im{position:relative;aspect-ratio:4/5;border-radius:22px 22px 0 0;overflow:hidden;background:#100e22}
.pc .n{position:absolute;left:12px;top:12px;font-size:13px;font-weight:700;color:#fff;background:rgba(10,8,20,.55);border-radius:999px;padding:4px 10px}
.hb{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(22,19,29,.14);display:flex;align-items:center;justify-content:center}
.pc .cap{background:#fff;border-radius:0 0 22px 22px;padding:13px 16px 15px;min-height:86px;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.3;box-shadow:inset 0 0 0 1.5px var(--line);animation:cin .6s ease both}
@keyframes pin{from{opacity:0;transform:translateY(26px) rotate(-1.2deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.panel{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr;gap:18px}
.now{background:#fff;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1.5px var(--line)}
.now .top2{display:flex;gap:18px;align-items:center}
.now .st{font-size:15px;font-weight:600;color:var(--mut)}
.now .t{font-family:var(--serif);font-weight:800;font-size:31px;letter-spacing:-.5px;line-height:1.05;margin-top:2px}
.ring{width:92px;height:92px;flex:none}
.ctl{display:flex;gap:10px}
.ctl .btn{flex:1;justify-content:center}
.btn.soft{background:var(--bg);color:var(--ink)}
.side{border-radius:24px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;min-height:0}
.side.ins{background:var(--v);color:#fff}
.side.ins h3{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1}
.side.ins p{font-size:18px;line-height:1.45;color:#e8deff}
.side.ins p b{color:#fff}
.side.chat{background:var(--v2)}
.side.chat h3{font-family:var(--serif);font-weight:800;font-size:26px}
.phr{display:flex;flex-wrap:wrap;gap:9px}
.phr span{background:#fff;border-radius:999px;padding:9px 16px;font-size:18px;font-weight:600}

/* vote (kahoot) */
.vbox{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:16px;min-height:0}
.vtop{display:flex;align-items:center;gap:22px}
.vtop .t{font-family:var(--serif);font-weight:800;font-size:44px;letter-spacing:-1px;line-height:1}
.vtop .d{font-size:19px;color:var(--mut);margin-top:6px}
.cnt{margin-left:auto;text-align:center;background:#fff;border-radius:22px;padding:10px 22px;box-shadow:inset 0 0 0 1.5px var(--line)}
.cnt b{display:block;font-family:var(--serif);font-weight:800;font-size:48px;line-height:1}
.cnt span{font-size:15px;font-weight:600;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tile{border-radius:28px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:var(--serif);font-weight:800;font-size:52px;letter-spacing:-1px}
.tile small{font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:0;opacity:.85}
.tile.r{background:var(--v)}.tile.f{background:var(--ink)}
.who-in{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.who-in span{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-size:16px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.who-in span.wait{background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);color:#b3adbc;animation:none;border:1.5px dashed #d6cfc4}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* reveal */
.rev{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:330px 1fr 450px;gap:30px;padding:20px 32px 26px;animation:rin .45s ease both;overflow:hidden}
.rev.m{background:radial-gradient(1200px 700px at 30% 20%,#7444f0,#4a1fb8 60%,#36148f)}
.rev.g{background:radial-gradient(1200px 700px at 30% 20%,#2b2738,#16131d 60%,#0d0b12)}
@keyframes rin{from{opacity:0}to{opacity:1}}
.rev .ph{position:relative;align-self:center}
.rev .ph .im{aspect-ratio:4/5;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(-2.5deg)}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--serif);font-weight:800;font-size:78px;letter-spacing:4px;padding:0 22px 6px;border:7px solid;border-radius:18px;animation:stamp .5s .35s cubic-bezier(.2,1.6,.4,1) both;background:rgba(255,255,255,.08)}
.rev.m .stamp{color:#fff;border-color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.3)}
.rev.g .stamp{color:#ff5a6e;border-color:#ff5a6e}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.mid{color:#fff;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.mid .sub{font-size:20px;font-weight:600;color:rgba(255,255,255,.78)}
.mid h2{font-family:var(--serif);font-weight:800;font-size:76px;line-height:.95;letter-spacing:-2.2px}
.split{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:12px;font-size:18px;font-weight:700}
.bar .tr{height:34px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:rgba(255,255,255,.35);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.ok .fl{background:#fff}
.bar .lb{display:flex;align-items:center;gap:8px}
.bar .n{font-family:var(--serif);font-size:26px;text-align:right}
.bub{background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:13px 18px;font-size:18px;line-height:1.42;font-weight:500}
.rev.g .bub{background:#2a2636}
.src{font-size:15px;color:rgba(255,255,255,.65)}
.wod{background:#fff;color:var(--ink);border-radius:24px;padding:18px 22px 18px;box-shadow:0 18px 40px rgba(0,0,0,.25);position:relative;animation:cin .6s .9s ease both}
.wod .wk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--v);background:var(--v2);border-radius:999px;padding:5px 12px 5px 9px}
.wod .ww{font-family:var(--serif);font-weight:800;font-size:44px;letter-spacing:-1px;line-height:1.05;margin:8px 0 4px;display:flex;align-items:baseline;gap:12px}
.wod .pos{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--mut);letter-spacing:0}
.wod .wd{font-size:19px;line-height:1.4;font-weight:500}
.wod .we{font-size:17px;line-height:1.4;color:#4a4553;margin-top:6px;padding-left:12px;border-left:3px solid var(--v3)}
.wod .wf{position:absolute;right:18px;top:16px;font-size:14px;color:var(--mut)}
.wod .wf b{color:var(--ink)}
.board{flex:none;background:rgba(255,255,255,.97);border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column}
.rev.g .board{background:#1f1c29;color:#fff}
.board h3{font-family:var(--serif);font-weight:800;font-size:25px;display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.board h3 .live{font-family:var(--sans);font-size:13px;font-weight:700;color:#fff;background:var(--bad);border-radius:6px;padding:3px 7px;display:flex;align-items:center;gap:5px}
.board h3 .live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rows{position:relative;flex:none}
.row{position:absolute;left:0;right:0;height:36px;display:grid;grid-template-columns:34px 1fr auto 56px;align-items:center;gap:8px;padding:0 10px 0 6px;border-radius:12px;transition:top 1s cubic-bezier(.3,.9,.3,1),background .4s;font-size:17px;font-weight:600}
.row .rk{font-family:var(--serif);font-weight:800;font-size:19px;text-align:center}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.row .sc{font-family:var(--serif);font-weight:800;font-size:21px;text-align:right}
.row .dl{font-size:14px;font-weight:800;border-radius:999px;padding:2px 8px;opacity:0;transform:scale(.5);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.row .dl.on{opacity:1;transform:none}
.dl.p{background:#e3f6ec;color:var(--ok)}.dl.m{background:#fde8e8;color:var(--bad)}.dl.z{background:#eee;color:#888}
.row.g1{background:#fff6d6}.row.g2{background:#eef1f6}.row.g3{background:#fbeee2}
.rev.g .row.g1{background:#3a3220}.rev.g .row.g2{background:#2c2f38}.rev.g .row.g3{background:#3a2d22}
.row .tag{font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px}
.rev.g .row .tag{background:#fff;color:var(--ink)}
.insl{margin-top:8px;font-size:14.5px;line-height:1.45;color:var(--mut);padding:0 6px}
.rev.g .insl{color:#a9a2b9}
.insl b{color:var(--ink)}.rev.g .insl b{color:#fff}
.go{display:flex;justify-content:flex-end;margin-top:12px}
.hz{position:absolute;inset:0;pointer-events:none;overflow:hidden}
@keyframes rise{to{transform:translateY(-1000px) rotate(16deg);opacity:0}}

/* lobby */
.lobby{position:absolute;inset:0;display:grid;grid-template-columns:600px 1fr;gap:40px;padding:44px 56px}
.lobby .l{display:flex;flex-direction:column;gap:20px}
.lobby h1{font-family:var(--serif);font-weight:800;font-size:66px;line-height:.98;letter-spacing:-2px}
.lobby h1 em{font-style:normal;color:var(--v)}
.join{display:flex;gap:24px;align-items:center;background:#fff;border-radius:28px;padding:22px;box-shadow:inset 0 0 0 1.5px var(--line)}
.qr{width:190px;height:190px;flex:none;border-radius:14px;background:#fff;padding:10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.join .k{font-size:16px;color:var(--mut);font-weight:600}
.join .code{font-family:var(--serif);font-weight:800;font-size:54px;letter-spacing:2px;line-height:1.05}
.join .u{font-size:18px;font-weight:600;margin-top:4px}
.sim{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#8a5a00;background:#fff3cf;border-radius:999px;padding:6px 12px;align-self:flex-start}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{background:#fff;border-radius:18px;padding:13px 16px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px;line-height:1.4}
.rule b{display:block;font-family:var(--serif);font-size:21px;margin-bottom:2px}
.isls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-content:start}
.isl{background:#fff;border-radius:26px;padding:20px;box-shadow:inset 0 0 0 1.5px var(--line);min-height:330px;display:flex;flex-direction:column;gap:10px}
.isl h3{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:28px}
.isl .pp{display:flex;flex-direction:column;gap:8px}
.isl .pp>span{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:19px;font-weight:700}
.isl .pp>span.nw{animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.lobby .bot{grid-column:2;display:flex;align-items:center;gap:16px;justify-content:flex-end}
.lobby .bot .c{font-family:var(--serif);font-weight:800;font-size:30px;margin-right:auto}

/* final */
.final{position:absolute;inset:0;padding:40px 56px;display:grid;grid-template-columns:1fr 470px;gap:40px}
.final h1{font-family:var(--serif);font-weight:800;font-size:62px;letter-spacing:-1.8px;line-height:1}
.final h1 em{font-style:normal;color:var(--v)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;height:470px;margin-top:30px}
.pd{display:flex;flex-direction:column;align-items:center;gap:8px}
.pd .n{font-family:var(--serif);font-weight:800;font-size:34px}
.pd .s{font-size:18px;font-weight:600;color:var(--mut)}
.pd .b{width:100%;border-radius:20px 20px 8px 8px;color:#fff;font-family:var(--serif);font-weight:800;font-size:64px;display:flex;justify-content:center;padding-top:14px;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.aw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.awd{border-radius:22px;padding:18px 20px;background:var(--v);color:#fff}
.awd.k{background:var(--ink)}
.awd small{font-size:15px;font-weight:600;opacity:.8}
.awd p{font-family:var(--serif);font-weight:800;font-size:28px;margin-top:2px}
.flist{background:#fff;border-radius:26px;padding:18px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:6px}
.flist .r{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;font-size:18px;font-weight:600;padding:6px 8px;border-radius:12px}
.flist .r b{font-family:var(--serif);font-weight:800}

/* phone preview (simulation) */
.phbtn{position:absolute;left:28px;bottom:26px;z-index:20}
.phbtn.intop{left:auto;right:auto;left:400px;top:26px;bottom:auto;height:44px}
.phone{position:absolute;left:26px;top:84px;z-index:21;width:290px;height:590px;border-radius:44px;background:#0c0b12;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column}
.phone .scr{flex:1;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.phone .nt{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:90px;height:24px;border-radius:14px;background:#0c0b12;z-index:2}
.phone .bar0{display:flex;justify-content:space-between;padding:12px 22px 0;font-size:13px;font-weight:700;height:38px}
.phone .hd{display:flex;align-items:center;gap:8px;padding:8px 18px 10px;font-family:var(--serif);font-weight:800;font-size:19px;border-bottom:1.5px solid var(--line)}
.phone .hd .me{margin-left:auto;font-family:var(--sans);font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:4px 10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.pv .ct{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.pv .big{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.5px}
.pv .tx{font-size:15.5px;line-height:1.45;color:#3b3644}
.pv .card{border-radius:20px;padding:16px;font-size:15px;line-height:1.45}
.pv .card.k{background:var(--ink);color:#fff}

  d[i+3]=255;if(a>=1){d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}else{d[i]+=(c[0]-d[i])*a;d[i+1]+=(c[1]-d[i+1])*a;d[i+2]+=(c[2]-d[i+2])*a}}
 add(x,y,c,q){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;c=C(c);const i=(y*this.w+x)*4,d=this.d;d[i]+=c[0]*q;d[i+1]+=c[1]*q;d[i+2]+=c[2]*q}
 get(x,y){const i=(y*this.w+x)*4;return [this.d[i],this.d[i+1],this.d[i+2]]}
 rect(x,y,w,h,c,a=1){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);for(let j=0;j<h;j++)for(let k=0;k<w;k++)this.px(x+k,y+j,c,a)}
 drect(x,y,w,h,c,p){x=Math.round(x);y=Math.round(y);for(let j=0;j<h;j++)for(let k=0;k<w;k++)if(p>bay(x+k,y+j))this.px(x+k,y+j,c)}
 vg(x,y,w,h,st){for(let j=0;j<h;j++){const t=h<2?0:j/(h-1)*(st.length-1),i=Math.min(st.length-2,Math.floor(t)),f=t-i;for(let k=0;k<w;k++)this.px(x+k,y+j,f>bay(x+k,y+j)?st[i+1]:st[i])}}
 hg(x,y,w,h,st){for(let k=0;k<w;k++){const t=w<2?0:k/(w-1)*(st.length-1),i=Math.min(st.length-2,Math.floor(t)),f=t-i;for(let j=0;j<h;j++)this.px(x+k,y+j,f>bay(x+k,y+j)?st[i+1]:st[i])}}
 poly(p,c,a=1,dp){let y0=Infinity,y1=-Infinity;p.forEach(q=>{y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const sy=y+.5,xs=[];for(let i=0;i<p.length;i++){const a1=p[i],b=p[(i+1)%p.length];if((a1[1]<=sy&&b[1]>sy)||(b[1]<=sy&&a1[1]>sy))xs.push(a1[0]+(sy-a1[1])/(b[1]-a1[1])*(b[0]-a1[0]))}
   xs.sort((m,n)=>m-n);for(let i=0;i+1<xs.length;i+=2)for(let x=Math.ceil(xs[i]-.5);x<=Math.floor(xs[i+1]-.5);x++){if(dp!==undefined){if(dp>bay(x,y))this.px(x,y,c)}else this.px(x,y,c,a)}}}
 ell(cx,cy,rx,ry,c,a=1){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(x,y,c,a)}}
 circ(cx,cy,r,c,a){this.ell(cx,cy,r,r,c,a)}
 ring(cx,cy,r,th,c){for(let y=Math.floor(cy-r-1);y<=Math.ceil(cy+r+1);y++)for(let x=Math.floor(cx-r-1);x<=Math.ceil(cx+r+1);x++){const d=Math.hypot(x+.5-cx,y+.5-cy);if(d<=r&&d>r-th)this.px(x,y,c)}}
 line(x0,y0,x1,y1,c,a=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){this.px(x0,y0,c,a);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

 cone(x0,y0,ang,spread,len,c,s){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=x+.5-x0,dy=y+.5-y0,d=Math.hypot(dx,dy);if(d>len||d<1)continue;let da=Math.atan2(dy,dx)-ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;da=Math.abs(da);if(da>spread)continue;const i=s*(1-d/len)*(1-Math.pow(da/spread,2)),q=Math.floor(i*5+bay(x,y))/5;if(q>0)this.add(x,y,c,q)}}

 spr(rows,pal,x,y,flip){rows.forEach((r,j)=>{const n=r.length;for(let k=0;k<n;k++){const ch=r[k];if(ch==='.'||ch===' ')continue;const col=pal[ch];if(!col)continue;this.px(flip?x+n-1-k:x+k,y+j,col)}})}

 tw(s,sc=1){let w=0;for(const ch of s){const g=FONT[ch]||FONT[' '];w+=(g[0].length+1)*sc}return w-sc}
 copy(o){this.d.set(o.d)}

/* ---------- shared pieces ---------- */
const SKY=['#07081d','#0d1033','#191a4b','#2a2365','#45307a','#6c3b84','#9a4a84'];

 x=-6;while(x<g.w){const w=10+r()*16|0,h=8+r()*24|0;const c=r()<.5?'#141336':'#17163d';g.rect(x,base-h,w,h,c);g.rect(x,base-h,w,1,'#26245a');

function street(g,y0,o={}){const w=g.w;

 if(o.lane){for(let x=(o.lo||0);x<w;x+=18)g.rect(x,o.lane,9,1,'#c9c2a0',.55)}

/* ---------- cars (side view, facing right, local length 88) ---------- */
function T(ox,oy,s,flip,L=88){return (x,y)=>[flip?ox+(L-x)*s:ox+x*s,oy+y*s]}
function mp(f,pts){return pts.map(p=>f(p[0],p[1]))}

 g.poly(mp(f,[[20,6.6],[30,6],[24,12],[16,12]]),P.glass2);g.poly(mp(f,[[40,5.6],[44,5.4],[38,12.4],[34,12.4]]),P.glass2);
 g.poly(mp(f,[[15,5.8],[18,5.4],[18,12.6],[13,12.6]]),P.body);g.poly(mp(f,[[36,5],[39,5],[39,12.8],[36,12.8]]),P.dark);
 if(o.head){const[hx,hy]=f(o.head[0],o.head[1]);g.ell(hx,hy,2.2*s,2.6*s,'#3a2e3c')}
 // seats (empty) silhouettes
 [[46,8.5],[26,8.5]].forEach(([sx,sy])=>{g.poly(mp(f,[[sx-3,sy],[sx-1,sy-1.5],[sx+.5,sy-1.5],[sx+.5,sy+4],[sx-3,sy+4]]),'#2d3554')});
 // lines
 g.poly(mp(f,[[9,13],[66,13],[66,13.8],[9,13.8]]),P.mid);
 [[36,13.5,25],[56,13.5,24]].forEach(([x,y0,y1])=>g.poly(mp(f,[[x,y0],[x+.6,y0],[x+.6,y1],[x,y1]]),P.shade));
 [[30,16],[50,16]].forEach(([x,y])=>g.poly(mp(f,[[x,y],[x+3,y],[x+3,y+.8],[x,y+.8]]),P.dark));
 // mirror
 g.poly(mp(f,[[60,11],[64,11],[64,13.5],[61,13.5]]),P.dark);
 // brand mark
 g.poly(mp(f,[[42,18],[47,18],[47,19.4],[42,19.4]]),P.acc);
 // lights
 g.poly(mp(f,[[2,15],[5,14],[5,18],[2,18]]),o.tail||'#c2213b');
 g.poly(mp(f,[[80,14.2],[85.5,16],[86,18],[81,17.6]]),o.headOn?'#fff6d8':'#4a4f66');
 if(o.hazard){g.poly(mp(f,[[2,18.2],[4.6,18.2],[4.6,19.6],[2,19.6]]),o.hz?'#ffb12b':'#6b4a2a');g.poly(mp(f,[[83,18.2],[86.4,18.2],[86.4,19.6],[83,19.6]]),o.hz?'#ffb12b':'#6b4a2a')}
 // roof sensor rack
 g.poly(mp(f,[[22,1.8],[46,1.4],[46,2.8],[22,3.2]]),'#2b2e3e');g.poly(mp(f,[[24,0],[27,0],[27,2],[24,2]]),'#2b2e3e');g.poly(mp(f,[[40,-.4],[44,-.4],[44,1.6],[40,1.6]]),'#2b2e3e');

/* ---------- generated soundtrack (Web Audio, no files) ---------- */
const SND=(()=>{let OUT=null,ctx=null,on=true,mode='off',seed=7,pend=null,step=0,nextT=0,master,mfilt,duck,kd,rev,fx,B={},nb=null,motif=[];
 try{on=localStorage.getItem('am-snd')!=='0'}catch(e){}
 const BPM=78,ST=60/BPM/4,SW=.17,mtof=m=>440*Math.pow(2,(m-69)/12);
 const PR=[[[2,[5,9,12,16]],[7,[5,9,11,16]],[0,[4,7,11,14]],[9,[7,11,12,16]]],
  [[5,[9,12,16,19]],[4,[7,11,14,17]],[9,[7,11,12,16]],[7,[5,9,12,14]]],
  [[0,[3,7,10,14]],[5,[3,8,12,15]],[8,[7,12,15,19]],[7,[5,10,14,17]]],
  [[0,[4,7,11,14]],[9,[7,12,16,19]],[2,[5,9,12,16]],[7,[5,11,14,17]]],
  [[8,[7,12,15,19]],[10,[5,10,14,17]],[0,[3,7,10,14]],[0,[2,7,10,15]]]];
 const KEYS=[0,3,-2,5,-4,2,-5,1,4];
 const LV={lobby:[.8,.7,.5,.45,.5,4200],read:[.95,.4,0,0,.6,1800],chat:[.8,.75,.6,.45,.4,5200],vote:[.6,.8,.75,0,.3,7200],reveal:[.85,.45,0,.4,.5,3000],end:[.85,.75,.6,.55,.4,6000],off:[0,0,0,0,0,800]};
 function rngS(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
 function mkMotif(s){const r=rngS(s*97+5),m=[];for(let i=0;i<32;i++){const p=i%4===0?.5:i%2===0?.22:.06;m.push(r()<p?{ix:Math.floor(r()*4),len:2+Math.floor(r()*3),up:r()<.3?12:0}:null)}return m}
 function noise(){if(nb)return nb;nb=ctx.createBuffer(1,ctx.sampleRate*.6|0,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nb}
 function impulse(sec){const n=ctx.sampleRate*sec|0,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}return b}
 function crackle(){const n=ctx.sampleRate*4|0,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){d[i]=(Math.random()*2-1)*.012;if(Math.random()<.0004){const a=(Math.random()*.5+.15)*(Math.random()<.5?1:-1);for(let j=0;j<40&&i+j<n;j++)d[i+j]+=a*Math.exp(-j/6)}}
  const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const h=ctx.createBiquadFilter();h.type='bandpass';h.frequency.value=2500;h.Q.value=.4;s.connect(h);h.connect(B.crk);s.start()}
 function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;try{ctx=new AC()}catch(e){return false}
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(ctx.destination);OUT=comp;
  master=ctx.createGain();master.gain.value=0;master.connect(comp);mfilt=ctx.createBiquadFilter();mfilt.type='lowpass';mfilt.frequency.value=1500;mfilt.Q.value=.5;mfilt.connect(master);
  duck=ctx.createGain();duck.connect(mfilt);rev=ctx.createConvolver();rev.buffer=impulse(3.2);const wet=ctx.createGain();wet.gain.value=.5;rev.connect(wet);wet.connect(duck);
  const bus=(r)=>{const g=ctx.createGain();g.gain.value=0;g.connect(duck);if(r){const s=ctx.createGain();s.gain.value=r;g.connect(s);s.connect(rev)}return g};
  kd=ctx.createGain();kd.connect(duck);B.keys=ctx.createGain();B.keys.gain.value=0;B.keys.connect(kd);const ks=ctx.createGain();ks.gain.value=.35;B.keys.connect(ks);ks.connect(rev);
  B.bass=bus(0);B.drums=bus(.08);B.lead=bus(.45);B.crk=bus(0);
  fx=ctx.createGain();fx.gain.value=on?.9:0;fx.connect(comp);
  crackle();motif=mkMotif(seed);setInterval(sched,25);return true}
 function set(m,sd){mode=m;if(sd!==undefined&&sd!==seed)pend=sd;if(!ctx)return;const L=LV[m]||LV.off,t=ctx.currentTime;
  ['keys','bass','drums','lead','crk'].forEach((k,i)=>{B[k].gain.cancelScheduledValues(t);B[k].gain.setTargetAtTime(L[i],t,.7)});
  mfilt.frequency.cancelScheduledValues(t);mfilt.frequency.setTargetAtTime(L[5],t,.8);
  master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(on&&m!=='off'?.85:0,t,.8);
  if(m==='reveal'){duck.gain.cancelScheduledValues(t);duck.gain.setTargetAtTime(.04,t,.05);duck.gain.setTargetAtTime(1,t+1.1,.5)}else{duck.gain.cancelScheduledValues(t);duck.gain.setTargetAtTime(1,t,.2)}}
 function sched(){if(!ctx||ctx.state!=='running')return;const ahead=ctx.currentTime+.2;if(nextT<ctx.currentTime)nextT=ctx.currentTime+.05;
  while(nextT<ahead){if(step%16===0&&pend!==null){seed=pend;pend=null;step=0;motif=mkMotif(seed)}play(step,nextT+(step%2?SW*ST:0));step++;nextT+=ST}}
 function play(st,t){const s=st%16,bar=Math.floor(st/16),pr=PR[seed%PR.length],[bn,vc]=pr[bar%4],k=KEYS[seed%KEYS.length],base=55+k;let bnote=36+k+bn;if(bnote>43)bnote-=12;

 ref('state').set({screen:S.screen,isl:S.isl,done:S.done.length?S.done.join(','):'',order:S.order.join(','),round:S.round,n:P.length,phase:S.phase,endsAt:S.endsAt,paused:S.paused,left:S.left,ins:S.ins,key:ans(p),tip:p.tip,k:mult(p)});
 ref('stats').set({fooled:S.fooled,right:S.right,insCount:S.insCount,streak:S.streak});ref('scores').set(S.scores)}
function pushResults(){if(!LIVE||!db)return;ref('results/'+vkey(S.isl,S.round)).set({delta:S.delta,bonus:S.bonus,last:S.last,prev:S.prev});ref('scores').set(S.scores)}
async function startLive(){try{await fbInit()}catch(e){NETERR='Could not reach Firebase. Check the internet and the config.';LIVE=false;render();return}
 let saved='';try{saved=localStorage.getItem('am-host-room')||''}catch(e){}
 CODE=saved||code();
 const snap=await ref().once('value');const room=snap.val();
 if(!room||!room.state){await ref().set({created:TS(),state:{screen:'lobby',isl:0,done:'',round:0,n:P.length}})}
 else restore(room);
 try{localStorage.setItem('am-host-room',CODE)}catch(e){}
 ref().on('value',s=>onRoom(s.val()||{}));render()}
function restore(room){const st=room.state||{};S.screen=st.screen||'lobby';S.isl=st.isl|0;S.done=String(st.done||'').split(',').filter(Boolean).map(Number);S.round=st.round||0;if(st.order)S.order=String(st.order).split(',').map(Number);S.phase=st.phase||'read';S.endsAt=st.endsAt||0;S.paused=!!st.paused;S.left=st.left||0;S.ins=st.ins||{};
 S.scores=room.scores||{};const sx=room.stats||{};S.fooled=sx.fooled||{};S.right=sx.right||{};S.insCount=sx.insCount||{};S.streak=sx.streak||{};
 const rs=(room.results||{})[vkey(S.isl,S.round)];if(S.phase==='reveal'&&rs){S.delta=rs.delta||{};S.bonus=rs.bonus||{};S.last=rs.last||{};S.prev=rs.prev||{};S.animDone=false}
 S.votes=((room.votes||{})[vkey(S.isl,S.round)])||{};S.t0=Date.now()-60000;S.cheered=1}
function onRoom(room){const ps=room.players||{};const before=new Set(PL.map(p=>p.id));const sig=Object.keys(ps).sort().join(',')+'|'+Object.values(ps).map(v=>v.on!==false?1:0).join('');const idsChanged=sig!==S.sig;S.sig=sig;
 PL=Object.entries(ps).map(([id,v])=>({id,name:String(v.name||'?').slice(0,16),isl:Math.max(0,Math.min(2,v.isl|0)),t:v.t||0,on:v.on!==false,nw:S.screen==='lobby'&&!before.has(id)})).sort((a,b)=>a.t-b.t);
 PL.forEach(ensure);
 const nv=((room.votes||{})[vkey(S.isl,S.round)])||{};const changed=JSON.stringify(nv)!==JSON.stringify(S.votes);
 if(S.screen==='lobby'){if(idsChanged)render();return}
 if(S.screen==='game'&&S.phase==='vote'&&changed){S.votes={...nv};if(idsChanged)render();votesChanged();return}
 if(idsChanged&&S.screen!=='game')render()}
function newGame(){clearT();if(LIVE){try{localStorage.removeItem('am-host-room')}catch(e){}}location.href=location.pathname}

/* =====================================================================
   PLAYER (phone)
   ===================================================================== */
let ROOM=null,PID='';
async function startPlayer(){fit();
 if(!FIREBASE_CONFIG){$('#app').innerHTML=mobShell('',`<div class="big">Not live yet</div><div class="tx">This copy of AutoMatch has no Firebase config, so phones can’t join. Ask the moderator for the live link.</div>`);return}
 $('#app').innerHTML=mobShell('',`<div class="big">Connecting…</div>`);
 try{await fbInit()}catch(e){$('#app').innerHTML=mobShell('',`<div class="big">No connection</div><div class="tx">Check your internet (wifi or 4G) and reload the page.</div>`);return}
 CODE=ROOM_Q;if(!CODE){renderCodeForm();return}
 try{PID=localStorage.getItem('am-pid-'+CODE)||''}catch(e){}
 ref().on('value',s=>{ROOM=s.val();renderPlayer()});
 db.ref('.info/connected').on('value',s=>{if(s.val()&&ROOM&&ROOM.players&&ROOM.players[PID]){ref('players/'+PID+'/on').set(true);ref('players/'+PID+'/on').onDisconnect().set(false)}});
 setInterval(()=>document.querySelectorAll('.mob .timer').forEach(t=>{const e=+t.dataset.end;if(e)t.textContent=Math.max(0,Math.ceil((e-now())/1000))+'s'}),250)}
function claim(id,name,isl){PID=id;try{localStorage.setItem('am-pid-'+CODE,id)}catch(e){}ref('players/'+id).set({name,isl,t:TS(),on:true});ref('players/'+id+'/on').onDisconnect().set(false)}
function renderCodeForm(){$('#app').innerHTML=mobShell('',`<div class="big">Join AutoMatch</div><div class="fld"><label for="rc">Room code from the big screen</label><input id="rc" autocomplete="off" placeholder="HONK-42" style="text-transform:uppercase"></div><button class="btn v" id="rcgo">Next</button>`);
 $('#rcgo').onclick=()=>{const v=$('#rc').value.toUpperCase().trim().replace(/[^A-Z0-9-]/g,'');if(v)location.href=location.pathname+'?room='+encodeURIComponent(v)}}
function mobShell(right,body){return `<div class="mob pv"><div class="hd">${HEART('var(--v)',3)}AutoMatch${right?`<span class="me">${right}</span>`:''}</div><div class="ct">${body}</div></div>`}
function liveModel(){const st=ROOM.state||{screen:'lobby'},ps=ROOM.players||{},me=PID&&ps[PID],sc=ROOM.scores||{};
 if(!me)return {screen:'join',code:CODE,players:ps};
 const ci=st.isl|0,dn=String(st.done||'').split(',').filter(Boolean).map(Number),vk='v'+ci+'_'+(st.round||0),mine=(me.isl|0)===ci;
 const cmp=(a,b)=>(sc[b]||0)-(sc[a]||0)||String(ps[a].name).localeCompare(String(ps[b].name));const ids=Object.keys(ps),all=ids.filter(k=>dn.includes(ps[k].isl|0)).sort(cmp),srt=ids.filter(k=>(ps[k].isl|0)===(me.isl|0)).sort(cmp),rk=srt.indexOf(PID),ab=rk>0?srt[rk-1]:null;
 const ins=mine&&Object.values(st.ins||{}).includes(PID),rs=mine?(ROOM.results||{})[vk]||null:null,myv=mine?(((ROOM.votes||{})[vk])||{})[PID]:null;
 let fooled=0;if(rs&&rs.last)Object.values(rs.last).forEach(L=>{if(L.ins===PID)fooled=L.fooled});
 return {screen:st.screen||'lobby',curIsl:ci,done:dn,name:me.name,isl:me.isl|0,round:st.round||0,phase:st.phase,endsAt:st.endsAt,paused:st.paused,left:st.left,insider:ins,key:st.key,tip:st.tip,k:st.k||1,myVote:myv,
  res:st.phase==='reveal'&&rs?{d:(rs.delta||{})[PID]||0,bonus:(rs.bonus||{})[PID]||0,isIns:ins,fooled}:null,rank:rk,np:srt.length,orank:all.indexOf(PID),onp:all.length,total:sc[PID]||0,ahead:ab?{name:ps[ab].name,diff:(sc[ab]||0)-(sc[PID]||0)}:null}}
function renderPlayer(){if(!ROOM){$('#app').innerHTML=mobShell('',`<div class="big">Room not found</div><div class="tx">Check the code on the big screen.</div><button class="btn v" id="rcb">Try another code</button>`);$('#rcb').onclick=()=>location.href=location.pathname+'#play';return}
 const m=liveModel();const pts=m.screen!=='join'?`${esc(m.name)} · ${plural(m.total,'pt')}${timerPill(m)}`:'';
 const a=document.activeElement&&document.activeElement.id==='jn';
 $('#app').innerHTML=mobShell(pts,phoneBody(m));
 if(m.screen!=='join'&&m.isl!==undefined)$('.mob .hd').style.boxShadow=`inset 0 -4px 0 ${['#ef5b3a','#11a07d','#2f6fe4'][m.isl]}`;
 const jn=$('#jn');if(jn){jn.oninput=e=>{JF.name=e.target.value};if(a){jn.focus();jn.setSelectionRange(jn.value.length,jn.value.length)}}
 document.querySelectorAll('[data-isl]').forEach(b=>b.onclick=()=>{JF.isl=+b.dataset.isl;JF.err='';renderPlayer()});
 const jc=$('#jcustom');if(jc)jc.onclick=()=>{JF.custom=true;renderPlayer()};const jb=$('#jback');if(jb)jb.onclick=()=>{JF.custom=false;renderPlayer()};
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{claim(b.dataset.pick,b.dataset.n,+b.dataset.i)});
 const go=$('#jgo');if(go)go.onclick=()=>{const n=JF.name.trim();if(!n){JF.err='Type your first name.';renderPlayer();return}if(JF.isl===null){JF.err='Pick your island.';renderPlayer();return}
  claim('x'+Math.random().toString(36).slice(2,9),n.slice(0,16),JF.isl)};
 document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{const st=ROOM.state||{};if(st.screen!=='game'||st.phase!=='vote'||m.myVote||m.insider||(st.isl|0)!==m.isl)return;if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}ref('votes/v'+(st.isl|0)+'_'+st.round+'/'+PID).set(b.dataset.pv)})}

/* ---------------- boot ---------------- */
addEventListener('keydown',e=>{if(MODE!=='host'||e.target.matches('input,textarea,select'))return;SND.resume();if(e.key==='m'||e.key==='M'){SND.toggle();render();return}if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}return}
 if(S.screen!=='game')return;if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();advance()}else if((e.key==='p'||e.key==='P')&&['read','chat','vote'].includes(S.phase))togglePause()});
window.__S=S;window.__adv=advance;window.__render=render;window.__SND=SND;window.__PL=()=>PL;
if(MODE==='player')startPlayer();else{render();if(LIVE)startLive();else startSim()}
})();
</script>
